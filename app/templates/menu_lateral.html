
<style>
    .layout-principal {
        display: flex;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        font-size: 16px;
    }

    .menu-lateral {
        width: 250px;
        min-width: 250px;
        background-color: #176b45;
        color: white;
        padding: 25px 15px;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        font-size: 16px !important;

        display: flex;
        flex-direction: column;
    }

    .menu-lateral h4 {
        font-size: 20px !important;
        font-weight: 600;
        padding: 0 10px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.2);
        margin-bottom: 30px;
    }

    .menu-lateral nav {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .menu-lateral a {
        display: block;
        color: white !important;
        text-decoration: none;
        font-size: 16px !important;
        font-weight: 400 !important;
        padding: 15px 12px;
        border-radius: 8px;
        transition: 0.2s;
        line-height: 1.5;
    }

    .menu-lateral a:hover {
        background-color: rgba(255,255,255,0.15);
    }

    .menu-lateral a.ativo {
        background-color: rgba(255,255,255,0.22);
        font-weight: 700 !important;
    }

    .menu-lateral form {
        margin-top: auto;
        padding-top: 30px;
    }

    .menu-lateral .sair {
        border: 1px solid rgba(255,255,255,0.5);
        text-align: center;
        font-size: 16px !important;
    }

    .conteudo-principal {
        flex: 1;
        min-width: 0;
        padding: 30px;
    }

    @media (max-width: 768px) {
        .layout-principal {
            flex-direction: column;
        }

        .menu-lateral {
            width: 100%;
            min-width: 100%;
            min-height: auto;
            padding: 18px;
        }

        .menu-lateral h4 {
            margin-bottom: 15px;
        }

        .menu-lateral nav {
            gap: 5px;
        }

        .menu-lateral a {
            display: inline-block;
            padding: 10px;
        }

        .menu-lateral form {
            margin-top: 10px;
            padding-top: 5px;
        }

        .conteudo-principal {
            padding: 20px 15px;
        }
    }
</style>

<aside class="menu-lateral">

    <h4>Controle Financeiro</h4>

    <nav>
        <a href="{% url 'dashboard' %}"
           class="{% if request.resolver_match.url_name == 'dashboard' %}ativo{% endif %}">
            🏠 Dashboard
        </a>

        <a href="{% url 'categorias' %}"
           class="{% if request.resolver_match.url_name == 'categorias' %}ativo{% endif %}">
            📁 Categorias
        </a>

        <a href="{% url 'lancamentos' %}"
           class="{% if request.resolver_match.url_name == 'lancamentos' %}ativo{% endif %}">
            💰 Receitas e Despesas
        </a>

        <a href="{% url 'contas' %}"
           class="{% if request.resolver_match.url_name == 'contas' %}ativo{% endif %}">
            📋 Contas a Pagar e Receber
        </a>
    </nav>

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-light w-100 sair">
            Sair
        </button>
    </form>

</aside>
