
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Criar conta - Controle Financeiro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7f5;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

       .cadastro-card {
            background-color: white;
            width: 100%;
            max-width: 650px;
            padding: 30px 45px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}
        
        .cadastro-card form {
            display: block;
}

        .cadastro-card form p {
            margin-bottom: 14px;
}

        .cadastro-card form ul {
            padding-left: 20px;
            margin-top: 5px;
            margin-bottom: 10px;
            font-size: 13px;
            color: #6c757d;
}

.cadastro-card form input {
    width: 100%;
}
        .cadastro-titulo {
            color: #176b45;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .cadastro-descricao {
            color: #6c757d;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .cadastro-card label {
            font-weight: 600;
            color: #343a40;
            margin-bottom: 7px;
        }

        .cadastro-card input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
        }

        .cadastro-card input:focus {
            border-color: #198754;
            box-shadow: 0 0 0 3px rgba(25,135,84,0.12);
        }

        .botao-cadastro {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 10px;
            background-color: #198754;
            border: none;
            color: white;
            transition: 0.2s;
        }

        .botao-cadastro:hover {
            background-color: #146c43;
        }

        .cadastro-link {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 0;
            color: #6c757d;
            font-size: 14px;
        }

        .cadastro-link a {
            color: #198754;
            font-weight: 600;
            text-decoration: none;
        }

        .cadastro-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
        .cadastro-card {
            padding: 25px 20px;
    }
}

        .cadastro-card form {
            grid-template-columns: 1fr;
    }
}
    </style>
</head>

<body>

    <div class="cadastro-card">

        <h2 class="cadastro-titulo">Criar conta</h2>

        <p class="cadastro-descricao">
            Cadastre-se para começar a organizar suas finanças.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            {% if form.errors %}
                <div class="alert alert-danger">
                    <strong>Erro ao cadastrar:</strong>
                    {{ form.errors }}
                </div>
            {% endif %}

            <button type="submit" class="botao-cadastro">
                Cadastrar
            </button>
        </form>

        <p class="cadastro-link">
            Já tem conta?
            <a href="{% url 'login' %}">Entrar</a>
        </p>

    </div>

</body>
</html>
